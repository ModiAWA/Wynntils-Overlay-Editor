name: Sync Wynntils functions

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: Optional Wynntils release tag or commit
        required: false
        type: string
      force:
        description: Force re-pinning provenance even when upstream content is unchanged
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-wynntils-functions
  cancel-in-progress: false

jobs:
  update:
    name: Refresh official function snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WYNNTILS_REF: ${{ inputs.ref || '' }}
      WYNNTILS_FORCE: ${{ inputs.force == true && '1' || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify the editor and the working tree
        run: |
          node --test tests/editor.test.js
          git diff --check

      - name: Generate from Wynntils official sources
        run: node scripts/sync-functions.mjs

      - name: Synchronize browser cache versions
        run: node scripts/sync-cache-versions.mjs

      - name: Verify generated editor data
        run: |
          node --check js/functions.generated.js
          node --check js/functions.zh.js
          git diff --check

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- js/functions.generated.js index.html cache-versions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Running the strict check before generating would abort the job in exactly the states the
      # sync can repair (moved tag, hand-edited provenance). Verify the committed tree here
      # instead: when the sync wrote nothing this is the same strict check as before, and a
      # repair is verified by the CI run that the last step dispatches on the generated branch.
      - name: Verify an unchanged snapshot is still canonical
        if: steps.changes.outputs.changed == 'false'
        env:
          WYNNTILS_REF: ''
        run: node scripts/sync-functions.mjs --check

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="automation/wynntils-functions"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add js/functions.generated.js index.html cache-versions.json
          git commit -m "chore(data): sync official Wynntils functions"
          remote_sha="$(git ls-remote --heads origin "$branch" | cut -f1)"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:$branch"
          else
            git push --set-upstream origin "HEAD:$branch"
          fi

          existing_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "chore(data): sync official Wynntils functions" \
              --body "Refreshes the offline function snapshot directly from the latest stable Wynntils release. Generated data and editor tests passed before this PR was opened."
          fi

      - name: Trigger CI on the generated branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Events caused by GITHUB_TOKEN do not start workflow runs, so a PR opened by
          # this workflow would have no check runs and could never satisfy the required
          # "Editor / Node.js 22" status check. workflow_dispatch is explicitly exempt
          # from that restriction, so dispatch CI for the generated branch ourselves.
          gh workflow run ci.yml --ref "automation/wynntils-functions"
