name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Editor / Node.js 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run checks
        run: pnpm check

      - name: Verify Wynntils function snapshot
        run: pnpm check:wynntils-functions

      - name: Verify Wynntils resource snapshot
        run: pnpm check:wynntils-resources

      - name: Check whitespace
        run: git diff --check

      - name: Run unit tests
        run: pnpm test:frontend

      - name: Run browser tests
        run: pnpm test:wynntils-browser

      - name: Upload browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: wynntils-editor-browser-diagnostics
          path: /tmp/wynntils-editor-playwright
          if-no-files-found: ignore
          retention-days: 7
